[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpeworld"
version = "1.0.0"
description = "MCPE Bedrock world editor CLI"
requires-python = ">=3.13"
dependencies = [
    "amulet-nbt>=2.1.0",
    "amulet-leveldb>=1.0.0",
    "sqlalchemy>=2.0.0",
    "curl-cffi>=0.16.0",
    "prompt-toolkit>=3.0.0",
    "Pillow>=12.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
mcpeworld = "mcpeworld.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
